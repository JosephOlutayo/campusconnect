# Runs the whole stack — Postgres, the Java API and the Next.js frontend — the
# way production runs it. Useful for checking the production config before
# pushing it anywhere.
#
#   cp .env.docker.example .env.docker   (then fill in the secret)
#   docker compose --env-file .env.docker up --build
#
# Then open http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusconnect
      POSTGRES_USER: ${DATABASE_USER:-campusconnect}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API must not start before Postgres can actually accept queries.
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-campusconnect} -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/campusconnect
      DATABASE_USER: ${DATABASE_USER:-campusconnect}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      CAMPUSCONNECT_JWT_SECRET: ${CAMPUSCONNECT_JWT_SECRET:?set CAMPUSCONNECT_JWT_SECRET}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}
      # Compose runs over plain HTTP locally, so Secure cookies would never be
      # sent. Behind real HTTPS this must be true — the prod profile's default.
      SECURE_COOKIES: "false"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      args:
        # Baked into the browser bundle, so it must be reachable FROM the browser.
        NEXT_PUBLIC_WS_URL: ${PUBLIC_API_URL:-http://localhost:8080}/ws
    depends_on:
      - api
    environment:
      # Server-side calls go container-to-container; the browser never sees this.
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
