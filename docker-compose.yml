# Runs the stack — Postgres and the CampusConnect application — the way
# production runs it. Useful for checking the production config against a real
# Postgres before pushing it anywhere.
#
#   cp .env.docker.example .env.docker   (then fill in the secret)
#   docker compose --env-file .env.docker up --build
#
# Then open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusconnect
      POSTGRES_USER: ${DATABASE_USER:-campusconnect}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app must not start before Postgres can actually accept queries.
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-campusconnect} -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/campusconnect
      DATABASE_USER: ${DATABASE_USER:-campusconnect}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      CAMPUSCONNECT_JWT_SECRET: ${CAMPUSCONNECT_JWT_SECRET:?set CAMPUSCONNECT_JWT_SECRET}
      # Pages and API share this origin, so verification links point here too.
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Compose runs over plain HTTP locally, so Secure cookies would never be
      # sent. Behind real HTTPS this must be true — the prod profile's default.
      SECURE_COOKIES: "false"
      # Without these, prod seeds nothing and there is no account that can add
      # a university — which leaves nobody able to sign up.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      # No SMTP server in Compose: verification links are printed to the log
      # rather than delivered, and the app is allowed to start without one.
      MAIL_OPTIONAL: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
