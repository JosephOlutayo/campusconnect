<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Saved · CampusConnect</title></head>
<body>
<main class="main">

  <h1 class="page-title">Saved</h1>
  <p class="page-sub">Providers you want to come back to.</p>

  <div class="grid grid-3" style="margin-top:1rem" th:if="${not #lists.isEmpty(cards)}">
    <!-- The loop sits on an outer block: a fragment call on the same tag would
         run before `card` exists. -->
    <th:block th:each="card : ${cards}">
      <div th:replace="~{fragments :: providerCard(${card})}"></div>
    </th:block>
  </div>

  <th:block th:if="${#lists.isEmpty(cards)}">
    <div th:replace="~{fragments :: empty('🔖', 'Nothing saved yet',
                      'Tap Save on a provider and they will wait for you here.')}"></div>
  </th:block>

</main>
</body>
</html>
