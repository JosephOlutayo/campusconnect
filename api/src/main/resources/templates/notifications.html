<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Notifications · CampusConnect</title></head>
<body>
<main class="main">

  <div class="row-between">
    <div>
      <h1 class="page-title" style="margin:0">Notifications</h1>
      <p class="page-sub" th:text="${unread} + ' unread'">0 unread</p>
    </div>
    <!-- Marking read is deliberate: a list that clears itself on sight stops
         being somewhere you can find what you have not dealt with. -->
    <form th:action="@{/notifications/read}" method="post" th:if="${unread > 0}">
      <button class="btn btn-secondary btn-sm" type="submit">Mark all read</button>
    </form>
  </div>

  <div class="stack" style="margin-top:1rem" th:unless="${#lists.isEmpty(items)}">
    <a class="card card-pad" th:each="n : ${items}" th:href="${n.href} ?: '/notifications'">
      <div class="row-between">
        <p style="font-weight:700" th:text="${n.title}">Booking confirmed</p>
        <span class="badge badge-warning" th:if="${n.readAt == null}">New</span>
      </div>
      <p class="small muted" style="margin:0.25rem 0 0" th:text="${n.body}">Details</p>
    </a>
  </div>

  <th:block th:if="${#lists.isEmpty(items)}">
    <div th:replace="~{fragments :: empty('🔔', 'Nothing yet',
                      'Booking updates, messages and reviews land here.')}"></div>
  </th:block>

</main>
</body>
</html>
