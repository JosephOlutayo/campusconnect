<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Bookings · CampusConnect</title></head>
<body>
<main class="main">

  <a class="small muted" th:href="@{/provider}">&larr; Dashboard</a>
  <h1 class="page-title" style="margin-top:0.5rem">Bookings</h1>
  <p class="page-sub">Everything students have booked with you.</p>

  <p class="form-error" style="margin-top:1rem" th:if="${error}" th:text="${error}">Could not do that.</p>

  <th:block th:if="${#lists.isEmpty(bookings)}">
    <div th:replace="~{fragments :: empty('📭', 'No bookings yet',
                      'They will appear here as students book you.')}"></div>
  </th:block>

  <div class="stack" style="margin-top:1rem" th:unless="${#lists.isEmpty(bookings)}">
    <div class="card card-pad" th:each="b : ${bookings}">
      <div class="row-between">
        <div>
          <p style="font-weight:700" th:text="${b.customer.name}">Student</p>
          <p class="tiny muted" style="margin:0.15rem 0 0"
             th:text="${b.service.title} + ' · ' + ${#temporals.format(b.startAt, 'EEE d MMM yyyy, h:mm a')}">
            Haircut · Mon 7 Sep 2026, 10:00 AM
          </p>
          <p class="tiny muted" style="margin:0.15rem 0 0"
             th:text="${b.code} + ' · $' + ${#numbers.formatDecimal(b.providerPayoutCents / 100.0, 1, 2)} + ' to you'">
            CC-XXXX · $22.50 to you
          </p>
        </div>
        <span class="badge"
              th:classappend="${b.status.name() == 'CONFIRMED'} ? 'badge-success' : (${b.status.name() == 'PENDING'} ? 'badge-warning' : (${b.status.name() == 'CANCELLED' or b.status.name() == 'NO_SHOW'} ? 'badge-danger' : ''))"
              th:text="${b.status}">CONFIRMED</span>
      </div>

      <!-- Which actions make sense depends on where the booking has got to.
           Offering "complete" on a cancelled booking would only produce a
           refusal from the server. -->
      <div class="row" style="gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap"
           th:if="${b.status.name() == 'PENDING' or b.status.name() == 'CONFIRMED'}">

        <form th:if="${b.status.name() == 'PENDING'}"
              th:action="@{'/provider/bookings/' + ${b.id} + '/confirm'}" method="post" style="flex:1">
          <button class="btn btn-block btn-sm" type="submit" data-busy="Confirming…">Confirm</button>
        </form>

        <form th:if="${b.status.name() == 'PENDING'}"
              th:action="@{'/provider/bookings/' + ${b.id} + '/decline'}" method="post" style="flex:1"
              data-confirm="Decline this booking?">
          <button class="btn btn-secondary btn-block btn-sm" type="submit">Decline</button>
        </form>

        <form th:if="${b.status.name() == 'CONFIRMED'}"
              th:action="@{'/provider/bookings/' + ${b.id} + '/complete'}" method="post" style="flex:1">
          <button class="btn btn-block btn-sm" type="submit" data-busy="Saving…">Mark completed</button>
        </form>

        <form th:if="${b.status.name() == 'CONFIRMED'}"
              th:action="@{'/provider/bookings/' + ${b.id} + '/no-show'}" method="post" style="flex:1"
              data-confirm="Mark this student as a no-show?">
          <button class="btn btn-secondary btn-block btn-sm" type="submit">No-show</button>
        </form>
      </div>

      <p class="tiny muted" style="margin:0.6rem 0 0"
         th:if="${b.status.name() == 'COMPLETED'}">
        Completed. The student can now leave a review.
      </p>
    </div>
  </div>

</main>
</body>
</html>
