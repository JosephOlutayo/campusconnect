<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>People · CampusConnect</title></head>
<body>
<main class="main">

  <a class="small muted" th:href="@{/admin}">&larr; Admin</a>
  <h1 class="page-title" style="margin-top:0.5rem">People</h1>
  <p class="page-sub">Every account on the platform.</p>

  <p class="form-error" style="margin-top:1rem" th:if="${error}" th:text="${error}">Could not do that.</p>

  <form class="searchbar" th:action="@{/admin/users}" method="get">
    <input class="input" type="search" name="q" th:value="${q}" placeholder="Search name or email">
    <button class="btn" type="submit">Search</button>
  </form>

  <div class="stack">
    <div class="card card-pad" th:each="p : ${people}">
      <div class="row-between">
        <div>
          <p style="font-weight:700">
            <span th:text="${p.name}">Name</span>
            <span class="badge badge-danger" th:if="${p.suspended}" style="margin-left:0.4rem">Suspended</span>
          </p>
          <p class="tiny muted" style="margin:0.15rem 0 0" th:text="${p.email}">email</p>
          <div class="row" style="gap:0.4rem;margin-top:0.35rem">
            <span class="badge" th:text="${p.role}">STUDENT</span>
            <span class="badge badge-success" th:if="${p.studentVerified}">Campus verified</span>
            <span class="badge" th:if="${p.university != null}"
                  th:text="${p.university.shortName}">UTD</span>
          </div>
        </div>
        <form th:action="@{'/admin/users/' + ${p.id} + '/suspend'}" method="post"
              th:attr="data-confirm=${p.suspended} ? null : 'Suspend this account?'">
          <button class="btn btn-sm" type="submit"
                  th:classappend="${p.suspended} ? 'btn-secondary' : 'btn-danger'"
                  th:text="${p.suspended} ? 'Restore' : 'Suspend'">Suspend</button>
        </form>
      </div>
    </div>
  </div>

  <th:block th:if="${#lists.isEmpty(people)}">
    <div th:replace="~{fragments :: empty('👤', 'Nobody found',
                      'Try a different search, or clear the box.')}"></div>
  </th:block>

</main>
</body>
</html>
