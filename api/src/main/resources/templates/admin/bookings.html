<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Bookings · CampusConnect</title></head>
<body>
<main class="main">

  <a class="small muted" th:href="@{/admin}">&larr; Admin</a>
  <h1 class="page-title" style="margin-top:0.5rem">Bookings</h1>
  <p class="page-sub">The 200 most recent, across the whole platform.</p>

  <!-- Read-only on purpose: an admin can see what happened so a dispute can be
       answered, but confirming or cancelling belongs to the two people in the
       booking. -->
  <div class="stack" style="margin-top:1rem" th:unless="${#lists.isEmpty(bookings)}">
    <a class="card card-pad" th:each="b : ${bookings}" th:href="@{'/appointments/' + ${b.id}}">
      <div class="row-between">
        <div>
          <p style="font-weight:700" th:text="${b.service.title}">Service</p>
          <p class="tiny muted" style="margin:0.15rem 0 0"
             th:text="${b.customer.name} + ' → ' + ${b.provider.businessName}">
            Customer → Business
          </p>
          <p class="tiny muted" style="margin:0.15rem 0 0"
             th:text="${b.code} + ' · ' + ${#temporals.format(b.startAt, 'd MMM yyyy, h:mm a')}">
            CC-XXXX · 7 Sep 2026, 10:00 AM
          </p>
        </div>
        <span class="badge"
              th:classappend="${b.status.name() == 'CONFIRMED'} ? 'badge-success' : (${b.status.name() == 'PENDING'} ? 'badge-warning' : (${b.status.name() == 'CANCELLED'} ? 'badge-danger' : ''))"
              th:text="${b.status}">CONFIRMED</span>
      </div>
    </a>
  </div>

  <th:block th:if="${#lists.isEmpty(bookings)}">
    <div th:replace="~{fragments :: empty('📒', 'No bookings yet',
                      'They appear here as soon as someone books.')}"></div>
  </th:block>

</main>
</body>
</html>
