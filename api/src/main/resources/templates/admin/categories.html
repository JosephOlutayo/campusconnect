<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Categories · CampusConnect</title></head>
<body>
<main class="main">

  <a class="small muted" th:href="@{/admin}">&larr; Admin</a>
  <h1 class="page-title" style="margin-top:0.5rem">Categories</h1>
  <p class="page-sub">The kinds of work providers can list under.</p>

  <div class="grid grid-3" style="margin-top:1rem">
    <div class="card card-pad" th:each="c : ${categories}">
      <div class="row-between">
        <div>
          <p style="font-weight:700">
            <span th:text="${c.icon}">C</span>
            <span th:text="${c.name}">Barbering</span>
          </p>
          <p class="tiny muted" style="margin:0.15rem 0 0" th:text="${c.description}">Description</p>
        </div>
        <span class="badge" th:unless="${c.active}">Hidden</span>
      </div>
      <form th:action="@{'/admin/categories/' + ${c.id} + '/toggle'}" method="post"
            style="margin-top:0.75rem">
        <button class="btn btn-secondary btn-block btn-sm" type="submit"
                th:text="${c.active} ? 'Hide' : 'Make live'">Hide</button>
      </form>
    </div>
  </div>

</main>
</body>
</html>
