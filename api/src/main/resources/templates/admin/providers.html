<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Providers · CampusConnect</title></head>
<body>
<main class="main">

  <a class="small muted" th:href="@{/admin}">&larr; Admin</a>
  <h1 class="page-title" style="margin-top:0.5rem">Providers</h1>
  <p class="page-sub">Businesses listed on the platform.</p>

  <div class="stack" style="margin-top:1rem">
    <div class="card card-pad" th:each="p : ${providers}">
      <div class="row-between">
        <div>
          <p style="font-weight:700">
            <span th:text="${p.businessName}">Business</span>
            <span class="badge badge-success" th:if="${p.verified}" style="margin-left:0.4rem">Verified</span>
          </p>
          <p class="tiny muted" style="margin:0.15rem 0 0"
             th:text="${p.user.name} + ' · ' + (${p.university != null} ? ${p.university.shortName} : 'No campus')">
            Owner · UTD
          </p>
          <p class="tiny muted" style="margin:0.15rem 0 0" th:text="${p.locationLabel}">Area</p>
        </div>
        <span class="badge"
              th:classappend="${p.status.name() == 'ACTIVE'} ? 'badge-success' : (${p.status.name() == 'PENDING'} ? 'badge-warning' : 'badge-danger')"
              th:text="${p.status}">ACTIVE</span>
      </div>

      <div class="row" style="gap:0.5rem;margin-top:0.75rem;flex-wrap:wrap">
        <form th:if="${p.status.name() != 'ACTIVE'}"
              th:action="@{'/admin/providers/' + ${p.id} + '/approve'}" method="post" style="flex:1">
          <button class="btn btn-block btn-sm" type="submit">Approve</button>
        </form>

        <form th:if="${p.status.name() == 'ACTIVE'}"
              th:action="@{'/admin/providers/' + ${p.id} + '/suspend'}" method="post" style="flex:1"
              data-confirm="Suspend this business? It disappears from search.">
          <button class="btn btn-secondary btn-block btn-sm" type="submit">Suspend</button>
        </form>

        <!-- Verified is the platform vouching for a business, so it is asked
             about rather than toggled casually. -->
        <form th:action="@{'/admin/providers/' + ${p.id} + '/verify'}" method="post" style="flex:1"
              th:attr="data-confirm=${p.verified} ? null : 'Mark this business as verified? This is the platform vouching for them.'">
          <button class="btn btn-secondary btn-block btn-sm" type="submit"
                  th:text="${p.verified} ? 'Remove verified' : 'Mark verified'">Mark verified</button>
        </form>
      </div>
    </div>
  </div>

  <th:block th:if="${#lists.isEmpty(providers)}">
    <div th:replace="~{fragments :: empty('💼', 'No providers yet',
                      'They appear here once someone sets up a business.')}"></div>
  </th:block>

</main>
</body>
</html>
