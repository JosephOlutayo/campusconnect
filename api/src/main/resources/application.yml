server:
  port: ${PORT:8080}
  forward-headers-strategy: framework # trust the platform's X-Forwarded-* headers

spring:
  application:
    name: campusconnect-api

  # H2 in file mode: zero setup, but the data survives a restart like a real
  # database. The `prod` profile below switches to Postgres.
  datasource:
    # AUTO_SERVER lets a second process (the H2 console, a CLI) attach while the
    # app is running. It is incompatible with DB_CLOSE_ON_EXIT, so that is left off.
    url: jdbc:h2:file:./data/campusconnect;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  # Off for local H2: the migrations are PostgreSQL, and a dev database that
  # can be deleted and rebuilt does not need versioning. Postgres gets it.
  flyway:
    enabled: false

  jpa:
    hibernate:
      # Fine for a disposable local database. Postgres uses Flyway instead —
      # see the prod profile for why.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  # No host by default: the app logs verification emails instead of sending
  # them, so local development needs no email account. The prod profile
  # refuses to start without a real host.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

campusconnect:
  jwt:
    # DEV ONLY. Startup fails in prod if this value is still in use — see
    # JwtService. Generate a real one with: openssl rand -base64 48
    secret: ${CAMPUSCONNECT_JWT_SECRET:dev-only-change-me-0123456789abcdefghijklmnop}
    ttl-days: 30
  # Starting marketplace fee. The admin console overrides this at runtime and
  # the stored value wins.
  platform-fee-percent: 10
  # Where the Next.js client runs, for CORS.
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3100}
  # Demo data. Never seeded in prod.
  seed: ${SEED_DEMO_DATA:true}
  # Session cookie Secure flag. Must be true anywhere served over HTTPS.
  secure-cookies: ${SECURE_COOKIES:false}
  # The first administrator, created only when no admin exists yet. Without
  # this a fresh production database is a deadlock: adding a university needs
  # an admin, and signing up needs a university.
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Administrator}
  # Where the frontend lives, for links inside emails.
  app-url: ${APP_URL:http://localhost:3100}
  mail:
    from: ${MAIL_FROM:CampusConnect <no-reply@localhost>}
    # Lets production start with no mail server. Verification links then go to
    # the log and nobody can earn the campus badge — a deliberate first-deploy
    # compromise, not a setting to leave on.
    optional: ${MAIL_OPTIONAL:false}

# Health only. Nothing else from actuator is exposed — /env and /beans would
# leak configuration including connection strings.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Whether the SMTP server answers right now is not a reason to take the app
    # out of rotation — everything except verification email keeps working, and
    # the platform would stop routing traffic over it. With no host configured
    # this check fails outright, which would block a deploy from ever going live.
    mail:
      enabled: false

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

---
# Local Postgres, still with demo data. `--spring.profiles.active=postgres`
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campusconnect}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
    # A database Hibernate already built is adopted at V1 rather than rebuilt.
    baseline-on-migrate: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

---
# PRODUCTION. `--spring.profiles.active=prod`
#
# Every difference here is deliberate:
#   - Postgres, with no default credentials to fall back on
#   - the H2 console is off
#   - demo data is off, so no admin@campusconnect.dev / password123 account
#     is ever created on a public host
#   - Secure cookies, since production is HTTPS
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    # Only for adopting a database Hibernate built before migrations existed.
    # Leave false on a database that has always used Flyway.
    baseline-on-migrate: ${FLYWAY_BASELINE:false}
  datasource:
    # Most platforms hand out host/port/name as separate variables and never a
    # jdbc: URL, so accept either shape: set DATABASE_URL yourself, or let it be
    # composed from the parts. There is no default host — a missing value must
    # fail loudly rather than quietly pointing production at localhost.
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema. `validate` means Hibernate only checks that what
      # the migrations built matches the entities, and refuses to start if it
      # does not — a missing migration becomes a failed deploy instead of
      # columns quietly missing at runtime. It never alters a live database.
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

campusconnect:
  seed: false
  secure-cookies: true

logging:
  level:
    root: WARN
    app.campusconnect: INFO
    org.springframework.web: WARN
