server:
  port: ${PORT:8080}
  forward-headers-strategy: framework # trust the platform's X-Forwarded-* headers

spring:
  application:
    name: campusconnect-api

  # H2 in file mode: zero setup, but the data survives a restart like a real
  # database. The `prod` profile below switches to Postgres.
  datasource:
    # AUTO_SERVER lets a second process (the H2 console, a CLI) attach while the
    # app is running. It is incompatible with DB_CLOSE_ON_EXIT, so that is left off.
    url: jdbc:h2:file:./data/campusconnect;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # Generated from the entities. Fine here; see the prod profile below for
      # why this is a liability once a database holds real data.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

campusconnect:
  jwt:
    # DEV ONLY. Startup fails in prod if this value is still in use — see
    # JwtService. Generate a real one with: openssl rand -base64 48
    secret: ${CAMPUSCONNECT_JWT_SECRET:dev-only-change-me-0123456789abcdefghijklmnop}
    ttl-days: 30
  # Starting marketplace fee. The admin console overrides this at runtime and
  # the stored value wins.
  platform-fee-percent: 10
  # Where the Next.js client runs, for CORS.
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3100}
  # Demo data. Never seeded in prod.
  seed: ${SEED_DEMO_DATA:true}
  # Session cookie Secure flag. Must be true anywhere served over HTTPS.
  secure-cookies: ${SECURE_COOKIES:false}
  # The first administrator, created only when no admin exists yet. Without
  # this a fresh production database is a deadlock: adding a university needs
  # an admin, and signing up needs a university.
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Administrator}

# Health only. Nothing else from actuator is exposed — /env and /beans would
# leak configuration including connection strings.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

---
# Local Postgres, still with demo data. `--spring.profiles.active=postgres`
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campusconnect}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# PRODUCTION. `--spring.profiles.active=prod`
#
# Every difference here is deliberate:
#   - Postgres, with no default credentials to fall back on
#   - the H2 console is off
#   - demo data is off, so no admin@campusconnect.dev / password123 account
#     is ever created on a public host
#   - Secure cookies, since production is HTTPS
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Most platforms hand out host/port/name as separate variables and never a
    # jdbc: URL, so accept either shape: set DATABASE_URL yourself, or let it be
    # composed from the parts. There is no default host — a missing value must
    # fail loudly rather than quietly pointing production at localhost.
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # `update` creates the schema on a FRESH database, which is what a first
      # deploy needs. It is safe while the database is empty and increasingly
      # not safe once it holds data you care about — Hibernate will happily add
      # columns based on whatever the entities currently say.
      #
      # Before this database holds real bookings: add Flyway, generate a
      # baseline migration from the live schema, and set this to `validate`.
      # Tracked in the README's pre-launch list.
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

campusconnect:
  seed: false
  secure-cookies: true

logging:
  level:
    root: WARN
    app.campusconnect: INFO
    org.springframework.web: WARN
