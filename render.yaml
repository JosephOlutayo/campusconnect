# Render Blueprint: provisions Postgres, the Java API and the Next.js frontend.
#
#   Render Dashboard -> New -> Blueprint -> pick this repository
#
# Several values are deliberately left blank (`sync: false`), so Render prompts
# for them rather than this file carrying them: the services' public URLs, which
# do not exist until the first deploy, and the first administrator's credentials.

databases:
  - name: campusconnect-db
    databaseName: campusconnect
    user: campusconnect
    plan: free

services:
  - type: web
    name: campusconnect-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    # Render polls this to decide the container is alive. It is the only
    # actuator endpoint exposed.
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Generated once by Render and never shown in this file. The app refuses
      # to start under `prod` with the published development default.
      - key: CAMPUSCONNECT_JWT_SECRET
        generateValue: true
      # Render exposes the database as one postgres:// URI. It does NOT offer
      # host or port as separate properties — only connectionString, user,
      # password and database — so the URI is the whole connection.
      # DatabaseUrlNormalizer converts it to the jdbc: form and pulls the
      # credentials out of it before the DataSource is built.
      - key: DATABASE_URL
        fromDatabase: { name: campusconnect-db, property: connectionString }
      # The frontend's public origin, WITH scheme and no trailing slash:
      #   https://campusconnect-web.onrender.com
      # Browser requests are rejected until this matches exactly.
      - key: CORS_ORIGINS
        sync: false
      # The first administrator. Demo data is off in production, so without
      # these nobody can sign in to add universities — and without a university
      # nobody can sign up at all. Password must be 12+ characters.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Lets the first deploy start before you own a sending domain. The site
      # works and people can sign up, but nobody can confirm an email address,
      # so the campus-verified badge cannot be earned. Delete this line and set
      # MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM once
      # you have a domain.
      - key: MAIL_OPTIONAL
        value: "true"
      # Verification links are built from this. Set it to the web service's
      # public URL, the same value as CORS_ORIGINS.
      - key: APP_URL
        sync: false

  - type: web
    name: campusconnect-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Where server-side rendering reaches the API. Set this to the API's
      # PUBLIC https:// URL.
      #
      # It used to come from `fromService … property: hostport`, meaning
      # Render's internal address. That did not work — every page needing the
      # API returned 500 while pages that tolerate it missing still rendered,
      # which is a confusing way for it to fail. The public URL is one extra
      # network hop and reliable.
      - key: API_BASE_URL
        sync: false
      # The WebSocket URL is baked into the browser bundle at BUILD time, so it
      # must be the API's public address:
      #   https://campusconnect-api.onrender.com/ws
      # Get this wrong and everything works except live messaging, silently.
      - key: NEXT_PUBLIC_WS_URL
        sync: false
