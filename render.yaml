# Render Blueprint: provisions Postgres, the Java API and the Next.js frontend.
#
#   Render Dashboard -> New -> Blueprint -> pick this repository
#
# Two values are deliberately left blank (`sync: false`). They are the public
# URLs of the services, which do not exist until the first deploy, so Render
# prompts for them. Fill them in and redeploy — see the note on each.

databases:
  - name: campusconnect-db
    databaseName: campusconnect
    user: campusconnect
    plan: free

services:
  - type: web
    name: campusconnect-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    # Render polls this to decide the container is alive. It is the only
    # actuator endpoint exposed.
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Generated once by Render and never shown in this file. The app refuses
      # to start under `prod` with the published development default.
      - key: CAMPUSCONNECT_JWT_SECRET
        generateValue: true
      # Render exposes the database as separate parts, so the prod profile
      # composes the jdbc: URL from them.
      - key: DATABASE_HOST
        fromDatabase: { name: campusconnect-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: campusconnect-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: campusconnect-db, property: database }
      - key: DATABASE_USER
        fromDatabase: { name: campusconnect-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: campusconnect-db, property: password }
      # The frontend's public origin, WITH scheme and no trailing slash:
      #   https://campusconnect-web.onrender.com
      # Browser requests are rejected until this matches exactly.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: campusconnect-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Server-side rendering calls the API directly over Render's private network.
      - key: API_BASE_URL
        fromService:
          name: campusconnect-api
          type: web
          property: hostport
      # The WebSocket URL is baked into the browser bundle at BUILD time, so it
      # must be the API's public address:
      #   https://campusconnect-api.onrender.com/ws
      # Get this wrong and everything works except live messaging, silently.
      - key: NEXT_PUBLIC_WS_URL
        sync: false
