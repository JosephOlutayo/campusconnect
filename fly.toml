# Fly.io configuration for the Next.js website.
#
#   fly launch --copy-config --no-deploy   (first time, to claim a name)
#   fly deploy
#
# Deploy the API first: this file points at it by name, and the WebSocket URL
# below is compiled into the browser bundle at build time.

app = "campusconnect-web"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Baked into the JavaScript the browser downloads, so it must be the API's
    # PUBLIC address — not the .internal one. Change it here and redeploy if
    # your API app ended up with a different name; getting this wrong leaves
    # every page working except live messaging, with no error anywhere.
    NEXT_PUBLIC_WS_URL = "https://campusconnect-api.fly.dev/ws"

[env]
  # Server-side rendering talks to the API over Fly's private network, which
  # never leaves their infrastructure and needs no TLS.
  API_BASE_URL = "http://campusconnect-api.internal:8080"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
